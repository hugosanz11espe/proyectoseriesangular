<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">

      <div class="card shadow-lg border-0 rounded-4">
        <div class="card-header bg-success text-white text-center rounded-top-4 py-3">
          <h2 class="h4 mb-0">
            <i class="bi bi-person-plus-fill me-2"></i>Nuevo personaje
          </h2>
        </div>

        <div class="card-body p-4">
          <form>
            <div class="form-floating mb-3">
              <input type="number" #cajaid class="form-control" id="cajaid" placeholder="Id" />
              <label for="cajaid">Id del personaje</label>
            </div>

            <div class="form-floating mb-3">
              <input type="text" #cajanombre class="form-control" id="cajanombre" placeholder="Nombre" />
              <label for="cajanombre">Nombre</label>
            </div>

            <div class="form-floating mb-3">
              <input type="text" #cajaimagen class="form-control" id="cajaimagen" placeholder="Imagen" />
              <label for="cajaimagen">URL de la imagen</label>
            </div>

            <div class="mb-4">
  <label for="cajaidserie" class="form-label fw-semibold">Serie</label>
  <select #cajaidserie class="form-select form-select-lg" id="cajaidserie">
    @for(serie of arrayseries; track serie.idSerie) {
      <option value="{{serie.idSerie}}">
        {{serie.nombre}}
      </option>
    }
  </select>
</div>

            <div class="d-grid">
              <button type="button" class="btn btn-success btn-lg" (click)="crearPersonaje()">
                <i class="bi bi-check-circle me-2"></i>Crear personaje
              </button>
            </div>
          </form>

          @if (mensaje) {
            <div class="alert alert-success text-center mt-4 mb-0" role="alert">
              {{mensaje}}
            </div>
          }
        </div>
      </div>

    </div>
  </div>
</div>
