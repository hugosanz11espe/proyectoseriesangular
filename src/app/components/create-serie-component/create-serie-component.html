<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">

      <div class="card shadow-lg border-0 rounded-4">
        <div class="card-header bg-success text-white text-center rounded-top-4 py-3">
          <h1 class="h3 mb-0">Nueva serie</h1>
        </div>

        <div class="card-body p-4">
          <form>
            <div class="form-floating mb-3">
              <input type="number" #cajaid class="form-control" id="cajaid" placeholder="Id" />
              <label for="cajaid">Id de la serie</label>
            </div>

            <div class="form-floating mb-3">
              <input type="text" #cajanombre class="form-control" id="cajanombre" placeholder="Nombre" />
              <label for="cajanombre">Nombre</label>
            </div>

            <div class="form-floating mb-3">
              <input type="text" #cajaimagen class="form-control" id="cajaimagen" placeholder="Imagen" />
              <label for="cajaimagen">URL de la imagen</label>
            </div>

            <div class="form-floating mb-4">
              <input type="number" #cajaanyo class="form-control" id="cajaanyo" placeholder="Año" />
              <label for="cajaanyo">Año</label>
            </div>

            <div class="d-grid">
              <button type="button" class="btn btn-success btn-lg" (click)="crearSerie()">
                Crear serie
              </button>
            </div>
          </form>

          @if (mensaje) {
            <div class="alert alert-success text-center mt-4 mb-0">{{mensaje}}</div>
          }
        </div>
      </div>

    </div>
  </div>
</div>
